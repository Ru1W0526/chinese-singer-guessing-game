<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华语乐坛猜猜猜 · 猜歌手</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif; }
  body { background:#0f0f12; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 16px 60px; }
  .app { max-width:800px; width:100%; }

  /* ---------- 头部 ---------- */
  .header { display:flex; justify-content:space-between; align-items:center; padding:12px 0 20px; border-bottom:1px solid #2a2a30; margin-bottom:22px; }
  .logo { display:flex; align-items:center; gap:10px; }
  .logo-icon { width:38px; height:38px; background:linear-gradient(135deg,#e84a5f,#ff847c); border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:20px; }
  .logo-text { font-size:20px; font-weight:700; color:#f0f0f5; letter-spacing:.5px; }
  .logo-text span { color:#e84a5f; }
  .lives { display:flex; gap:5px; }
  .life-dot { width:12px; height:12px; border-radius:50%; background:#e84a5f; transition:all .3s; }
  .life-dot.lost { background:#2a2a30; }

  /* ---------- 线索区 ---------- */
  .clue-section { display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
  .clue-item {
    background:#1a1a20; border:1px solid #2a2a30; border-radius:14px;
    padding:14px 18px; display:flex; align-items:center; gap:14px;
    transition:all .45s cubic-bezier(.22,1,.36,1);
  }
  .clue-item.locked { opacity:.55; }
  .clue-item.locked .clue-body { color:#5a5a6a; letter-spacing:3px; }
  .clue-item.unlocked { border-color:#3a3a48; }
  .clue-item.pop { animation:cluePop .6s cubic-bezier(.22,1,.36,1); }
  @keyframes cluePop {
    0%   { transform:scale(.95); box-shadow:0 0 0 0 rgba(232,74,95,.5); }
    50%  { transform:scale(1.015); box-shadow:0 0 0 10px rgba(232,74,95,0); }
    100% { transform:scale(1); box-shadow:0 0 0 0 rgba(232,74,95,0); }
  }
  .clue-badge {
    flex-shrink:0; font-size:11px; font-weight:700; letter-spacing:.8px;
    color:#ff847c; background:rgba(232,74,95,.12);
    border:1px solid rgba(232,74,95,.3);
    padding:5px 10px; border-radius:8px; white-space:nowrap;
  }
  .clue-item.locked .clue-badge { color:#6b6b7a; background:#22222a; border-color:#33333d; }
  .clue-body { font-size:14px; color:#c5c5d0; line-height:1.5; }
  .clue-body strong { color:#ff847c; }

  /* ---------- 搜索 ---------- */
  .search-section { position:relative; margin-bottom:14px; }
  .search-box { display:flex; gap:10px; }
  .search-box input {
    flex:1; background:#1a1a20; border:1.5px solid #2a2a30; border-radius:14px;
    padding:14px 18px; font-size:15px; color:#f0f0f5; outline:none; transition:border-color .2s;
  }
  .search-box input:focus { border-color:#e84a5f; }
  .search-box input::placeholder { color:#5a5a6a; }
  .search-box input:disabled { opacity:.5; }
  .search-box button#guessBtn {
    background:linear-gradient(135deg,#e84a5f,#c73e52); border:none; border-radius:14px;
    padding:14px 28px; font-size:15px; font-weight:600; color:#fff; cursor:pointer;
    transition:opacity .2s, transform .1s; white-space:nowrap;
  }
  .search-box button#guessBtn:hover { opacity:.9; }
  .search-box button#guessBtn:active { transform:scale(.97); }
  .search-box button#guessBtn:disabled { opacity:.35; cursor:not-allowed; }

  /* ---------- 放弃按钮 ---------- */
  .action-row { display:flex; justify-content:center; margin-bottom:22px; }
  .btn-giveup {
    background:transparent; border:1.5px solid #3a3a48; border-radius:12px;
    padding:10px 22px; font-size:13px; color:#8a8a9a; cursor:pointer;
    transition:all .2s; letter-spacing:.3px;
  }
  .btn-giveup:hover { border-color:#a83a3a; color:#f08080; background:rgba(168,58,58,.08); }
  .btn-giveup:disabled { opacity:.35; cursor:not-allowed; }

  /* ---------- 自动补全 ---------- */
  .suggestions {
    position:absolute; top:100%; left:0; right:0; background:#1a1a20;
    border:1px solid #2a2a30; border-radius:14px; margin-top:6px;
    max-height:250px; overflow-y:auto; z-index:100; display:none;
    box-shadow:0 12px 32px rgba(0,0,0,.55);
  }
  .suggestions.active { display:block; }
  .suggestion-item {
    padding:10px 16px; font-size:14px; color:#c5c5d0; cursor:pointer;
    transition:background .15s; display:flex; align-items:center; gap:12px;
  }
  .suggestion-item:hover { background:#25252e; }
  .suggestion-item .s-name { flex:1; font-weight:500; }
  .suggestion-item .s-meta { font-size:11px; color:#6b6b7a; white-space:nowrap; }

  /* ---------- 头像 ---------- */
  .avatar {
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:700; color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.35); user-select:none;
    box-shadow:0 2px 8px rgba(0,0,0,.35);
  }
  .avatar.sm { width:30px; height:30px; font-size:13px; }

  /* ---------- 猜测表格 ---------- */
  .guess-table { display:none; margin-top:4px; }
  .guess-table.active { display:block; }
  .table-header {
    display:grid; grid-template-columns:2fr 1fr .9fr .7fr 1.1fr .9fr;
    gap:6px; padding:0 4px 10px;
  }
  .table-header .th {
    font-size:11px; text-transform:uppercase; letter-spacing:.8px;
    color:#6b6b7a; text-align:center;
  }
  .table-header .th:first-child { text-align:left; padding-left:6px; }
  .guess-row {
    display:grid; grid-template-columns:2fr 1fr .9fr .7fr 1.1fr .9fr;
    gap:6px; margin-bottom:6px;
    animation:rowIn .45s cubic-bezier(.22,1,.36,1);
  }
  @keyframes rowIn { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  .cell {
    background:#1a1a20; border:1px solid #2a2a30; border-radius:10px;
    padding:10px 5px; text-align:center; font-size:13px; color:#c5c5d0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:60px; line-height:1.3; transition:background .2s;
  }
  .cell.name-cell {
    flex-direction:row; align-items:center; justify-content:flex-start;
    gap:10px; padding-left:10px; font-weight:600; color:#f0f0f5; font-size:14px;
    text-align:left;
  }
  .cell .arrow { font-size:15px; margin-top:2px; line-height:1; }
  .cell.correct { background:#1b3a2a; border-color:#2e7d4f; color:#6ee7a0; }
  .cell.partial { background:#3a3320; border-color:#a88b2e; color:#f0d060; }
  .cell.wrong   { background:#3a1f22; border-color:#a83a3a; color:#f08080; }
  .cell.higher  { background:#1a2a3a; border-color:#3a6a9a; color:#80b0f0; }
  .cell.lower   { background:#2a1a2a; border-color:#8a4a8a; color:#d080d0; }

  /* ---------- 结果面板 ---------- */
  .result-panel {
    display:none; background:#1a1a20; border:1.5px solid #2a2a30;
    border-radius:18px; padding:32px 24px; text-align:center; margin-top:22px;
    animation:panelIn .5s cubic-bezier(.22,1,.36,1);
  }
  .result-panel.active { display:block; }
  @keyframes panelIn { from{opacity:0; transform:scale(.92);} to{opacity:1; transform:scale(1);} }
  .result-emoji { font-size:56px; margin-bottom:12px; }
  .result-title { font-size:22px; font-weight:700; color:#f0f0f5; margin-bottom:8px; }
  .result-sub { font-size:15px; color:#8a8a9a; margin-bottom:20px; line-height:1.6; }
  .result-answer-wrap { display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:26px; }
  .result-answer {
    display:inline-block; background:#25252e; border:1px solid #3a3a45;
    border-radius:12px; padding:10px 26px; font-size:20px; font-weight:700; color:#ff847c;
  }
  .btn-restart {
    background:linear-gradient(135deg,#e84a5f,#c73e52); border:none; border-radius:14px;
    padding:14px 40px; font-size:15px; font-weight:600; color:#fff; cursor:pointer;
    transition:opacity .2s, transform .1s;
  }
  .btn-restart:hover { opacity:.9; }
  .btn-restart:active { transform:scale(.97); }

  /* ---------- 图例 ---------- */
  .legend {
    display:flex; flex-wrap:wrap; gap:14px; justify-content:center;
    margin-top:28px; padding-top:20px; border-top:1px solid #2a2a30;
  }
  .legend-item { display:flex; align-items:center; gap:6px; font-size:12px; color:#6b6b7a; }
  .legend-dot { width:10px; height:10px; border-radius:3px; }
  .legend-dot.green  { background:#2e7d4f; }
  .legend-dot.yellow { background:#a88b2e; }
  .legend-dot.red    { background:#a83a3a; }
  .legend-dot.blue   { background:#3a6a9a; }
  .legend-dot.purple { background:#8a4a8a; }

  /* ---------- Toast ---------- */
  .toast {
    position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-90px);
    background:#2a1f22; border:1px solid #a83a3a; border-radius:12px;
    padding:12px 24px; font-size:14px; color:#f08080; opacity:0;
    transition:all .35s cubic-bezier(.22,1,.36,1); z-index:200;
    pointer-events:none; white-space:nowrap; max-width:90vw; overflow:hidden; text-overflow:ellipsis;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- 移动端 ---------- */
  @media (max-width:640px) {
    .table-header, .guess-row { grid-template-columns:2.1fr 1fr .85fr .6fr 1fr .85fr; gap:4px; }
    .cell { font-size:11px; padding:8px 3px; min-height:54px; border-radius:8px; }
    .cell.name-cell { font-size:12px; padding-left:7px; gap:7px; }
    .avatar { width:28px; height:28px; font-size:12px; }
    .avatar.sm { width:24px; height:24px; font-size:11px; }
    .table-header .th { font-size:9px; }
    .search-box button#guessBtn { padding:14px 16px; font-size:14px; }
    .logo-text { font-size:17px; }
    .clue-body { font-size:13px; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="action-row">

  <!-- 猜测记录 -->

  <!-- 结果 -->
  <div class="result-panel" id="resultPanel">

    </div>
    <button class="btn-restart" id="restartBtn">再来一局</button>
  </div>

  <!-- 图例 -->
  <div class="legend">

    <div class="legend-item"><div class="legend-dot red"></div>不匹配</div>
    <div class="legend-item"><div class="legend-dot blue"></div>答案更晚 / 更高</div>
    <div class="legend-item"><div class="legend-dot purple"></div>答案更早 / 更低</div>
  </div>
</div>

<div class="toast" id="toast"></div>

/* =========================================================
   属性值域
   ========================================================= */
const REGIONS = ['中国内地','中国香港','中国台湾','新加坡','马来西亚','美国'];
const DECADES = ['1970s','1980s','1990s','2000s','2010s'];
const MAX_LIVES = 8;

/* =========================================================
   头像工具（首字母 + 渐变色）
   ========================================================= */
const GRADIENTS = [
  ['#e84a5f','#ff847c'], ['#6c5ce7','#a29bfe'], ['#00b894','#55efc4'],
  ['#0984e3','#74b9ff'], ['#fdcb6e','#e17055'], ['#e84393','#fd79a8'],
  ['#00cec9','#81ecec'], ['#d63031','#ff7675'], ['#2d3436','#636e72'],
  ['#6ab04c','#badc58'], ['#4834d4','#686de0'], ['#c0392b','#e74c3c'],
  ['#16a085','#1abc9c'], ['#8e44ad','#9b59b6'], ['#f39c12','#f1c40f'],
];
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}
function avatarStyle(name) {
  const g = GRADIENTS[hashStr(name) % GRADIENTS.length];
  return `background:linear-gradient(135deg,${g[0]},${g[1]});`;
}
function avatarInitial(name) {
  // 英文名取首字母，中文取首字
  return /^[A-Za-z]/.test(name) ? name[0].toUpperCase() : name[0];
}
function createAvatar(name, small) {
  const el = document.createElement('div');
  el.className = 'avatar' + (small ? ' sm' : '');
  el.style.cssText = avatarStyle(name);
  el.textContent = avatarInitial(name);
  return el;
}

/* =========================================================
   游戏状态
   ========================================================= */
let secretSinger = null;
let guesses = [];
let gameOver = false;
let lives = MAX_LIVES;
const revealedClues = { 1:false, 2:false, 3:false };

/* DOM */
const searchInput   = document.getElementById('searchInput');
const guessBtn      = document.getElementById('guessBtn');
const giveupBtn     = document.getElementById('giveupBtn');
const suggestions   = document.getElementById('suggestions');
const guessTable    = document.getElementById('guessTable');
const guessRows     = document.getElementById('guessRows');
const resultPanel   = document.getElementById('resultPanel');
const resultEmoji   = document.getElementById('resultEmoji');
const resultTitle   = document.getElementById('resultTitle');
const resultSub     = document.getElementById('resultSub');
const resultAnswer  = document.getElementById('resultAnswer');
const resultAvatar  = document.getElementById('resultAvatar');
const restartBtn    = document.getElementById('restartBtn');
const toast         = document.getElementById('toast');
const livesContainer= document.getElementById('livesContainer');
const clueItem1     = document.getElementById('clueItem1');
const clueItem2     = document.getElementById('clueItem2');
const clueItem3     = document.getElementById('clueItem3');
const clueBody1     = document.getElementById('clueBody1');
const clueBody2     = document.getElementById('clueBody2');
const clueBody3     = document.getElementById('clueBody3');

/* =========================================================
   工具
   ========================================================= */
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
}

function updateLivesUI() {
  livesContainer.querySelectorAll('.life-dot').forEach((dot, i) => {
    dot.classList.toggle('lost', i >= lives);
  });
}

/* =========================================================
   线索生成 & 解锁
   ========================================================= */
function buildClueText(num) {
  const s = secretSinger;
  if (num === 1) {
    return `这位歌手<strong>出道于 ${s.decade}</strong>，在乐坛有着举足轻重的地位。`;
  }
  if (num === 2) {
    const g = s.gender === '乐队' ? '一个乐队组合' : `一位${s.gender}歌手`;
    return `来自 <strong>${s.region}</strong>，是${g}。`;
  }
  if (num === 3) {
    const list = s.songs.map(x => `《${x}》`).join('、');
    return `代表作品：<strong>${list}</strong>。`;
  }
  return '';
}

function revealClue(num, animate) {
  if (revealedClues[num]) return;
  revealedClues[num] = true;
  const item = document.getElementById('clueItem' + num);
  const body = document.getElementById('clueBody' + num);
  body.innerHTML = buildClueText(num);
  item.classList.remove('locked');
  item.classList.add('unlocked');
  if (animate) {
    item.classList.add('pop');
    setTimeout(() => item.classList.remove('pop'), 700);
  }
}

function updateCluesByProgress(animate) {
  const wrong = MAX_LIVES - lives;
  if (wrong >= 0) revealClue(1, animate && wrong === 0);
  if (wrong >= 2) revealClue(2, animate && wrong === 2);
  if (wrong >= 4) revealClue(3, animate && wrong === 4);
}

function revealAllClues() {
  for (let i = 1; i <= 3; i++) revealClue(i, false);
}

/* =========================================================
   属性比较
   ========================================================= */
function compareRegion(g, s) {
  if (g === s) return { result:'correct', arrow:'' };
  const gi = REGIONS.indexOf(g), si = REGIONS.indexOf(s);
  if (gi === -1 || si === -1) return { result:'wrong', arrow:'' };
  if (Math.abs(gi - si) === 1) return { result:'partial', arrow: si > gi ? '→' : '←' };
  return { result:'wrong', arrow: si > gi ? '→' : '←' };
}
function compareDecade(g, s) {
  if (g === s) return { result:'correct', arrow:'' };
  const gi = DECADES.indexOf(g), si = DECADES.indexOf(s);
  if (gi === -1 || si === -1) return { result:'wrong', arrow:'' };
  if (Math.abs(gi - si) === 1) return { result:'partial', arrow: si > gi ? '→' : '←' };
  return { result: si > gi ? 'higher' : 'lower', arrow: si > gi ? '→' : '←' };
}
function compareGender(g, s) {
  return g === s ? { result:'correct', arrow:'' } : { result:'wrong', arrow:'' };
}
function compareGenre(g, s) {
  if (g === s) return { result:'correct', arrow:'' };
  const gp = g.split('/'), sp = s.split('/');
  if (gp.some(p => sp.includes(p))) return { result:'partial', arrow:'' };
  return { result:'wrong', arrow:'' };
}
function compareStatus(g, s) {
  if (g === s) return { result:'correct', arrow:'' };
  if ((g === '活跃' && s === '隐退') || (g === '隐退' && s === '活跃')) {
    return { result:'partial', arrow:'' };
  }
  return { result:'wrong', arrow:'' };
}

/* =========================================================
   渲染猜测行
   ========================================================= */
function renderGuessRow(singer) {
  const row = document.createElement('div');
  row.className = 'guess-row';

  // 姓名 + 头像
  const nameCell = document.createElement('div');
  nameCell.className = 'cell name-cell';
  nameCell.appendChild(createAvatar(singer.name, true));
  const nameSpan = document.createElement('span');
  nameSpan.textContent = singer.name;
  nameCell.appendChild(nameSpan);
  row.appendChild(nameCell);

  const fields = [
    { value: singer.region, cmp: compareRegion(singer.region, secretSinger.region) },
    { value: singer.decade, cmp: compareDecade(singer.decade, secretSinger.decade) },
    { value: singer.gender, cmp: compareGender(singer.gender, secretSinger.gender) },
    { value: singer.genre,  cmp: compareGenre(singer.genre, secretSinger.genre) },
    { value: singer.status, cmp: compareStatus(singer.status, secretSinger.status) },
  ];

  fields.forEach(f => {
    const cell = document.createElement('div');
    cell.className = 'cell ' + f.cmp.result;
    cell.innerHTML = `<span>${f.value}</span>` +
      (f.cmp.arrow ? `<span class="arrow">${f.cmp.arrow}</span>` : '');
    row.appendChild(cell);
  });

  guessRows.prepend(row);
}

/* =========================================================
   提交猜测
   ========================================================= */
function submitGuess(name) {
  if (gameOver) return;
  const trimmed = (name || '').trim();
  if (!trimmed) { showToast('请输入歌手名字'); return; }

  const singer = SINGERS.find(s => s.name === trimmed);
  if (!singer) {
    const fuzzy = SINGERS.filter(s => s.name.includes(trimmed) || trimmed.includes(s.name));
    if (fuzzy.length === 1) return submitGuess(fuzzy[0].name);
    showToast('未找到该歌手，请检查名字是否正确');
    return;
  }

  if (guesses.some(g => g.name === singer.name)) {
    showToast('你已经猜过这位歌手了');
    return;
  }

  guesses.push(singer);
  renderGuessRow(singer);
  guessTable.classList.add('active');
  searchInput.value = '';
  suggestions.classList.remove('active');

  /* ---- 猜中 ---- */
  if (singer.name === secretSinger.name) {
    gameOver = true;
    searchInput.disabled = true;
    guessBtn.disabled = true;
    giveupBtn.disabled = true;
    revealAllClues();
    showResult('win', guesses.length);
    return;
  }

  /* ---- 猜错 ---- */
  lives--;
  updateLivesUI();
  updateCluesByProgress(true);

  if (lives <= 0) {
    gameOver = true;
    searchInput.disabled = true;
    guessBtn.disabled = true;
    giveupBtn.disabled = true;
    revealAllClues();
    showResult('lose', 0);
  }
}

/* =========================================================
   结果面板
   ========================================================= */
function showResult(type, used) {
  resultAvatar.style.cssText = avatarStyle(secretSinger.name) + 'width:46px;height:46px;font-size:19px;';
  resultAvatar.textContent = avatarInitial(secretSinger.name);
  resultAnswer.textContent = secretSinger.name;

  if (type === 'win') {
    resultEmoji.textContent = '🎉';
    resultTitle.textContent = '恭喜猜中！';
    resultSub.textContent = `你用了 ${used} 次猜测锁定答案`;
  } else if (type === 'giveup') {
    resultEmoji.textContent = '🏳️';
    resultTitle.textContent = '你选择了放弃';
    resultSub.textContent = '正确答案是';
  } else {
    resultEmoji.textContent = '💔';
    resultTitle.textContent = '机会用完了';
    resultSub.textContent = '正确答案是';
  }
  resultPanel.classList.add('active');
  resultPanel.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

/* =========================================================
   重置游戏
   ========================================================= */
function resetGame() {
  secretSinger = SINGERS[Math.floor(Math.random() * SINGERS.length)];
  guesses = [];
  gameOver = false;
  lives = MAX_LIVES;
  updateLivesUI();

  guessRows.innerHTML = '';
  guessTable.classList.remove('active');
  resultPanel.classList.remove('active');
  searchInput.value = '';
  searchInput.disabled = false;
  guessBtn.disabled = false;
  giveupBtn.disabled = false;

  // 重置线索
  revealedClues[1] = revealedClues[2] = revealedClues[3] = false;
  [clueItem1, clueItem2, clueItem3].forEach((item, i) => {
    item.classList.add('locked');
    item.classList.remove('unlocked', 'pop');
  });
  clueBody1.innerHTML = '● ● ● ● ● ● ●';
  clueBody2.innerHTML = '● ● ● ● ● ● ●';
  clueBody3.innerHTML = '● ● ● ● ● ● ●';

  // 开局显示第一条线索
  revealClue(1, false);

  searchInput.focus();
}

/* =========================================================
   自动补全
   ========================================================= */
function showSuggestions(query) {
  const q = query.trim().toLowerCase();
  if (!q) { suggestions.classList.remove('active'); return; }

  const matches = SINGERS
    .filter(s => s.name.toLowerCase().includes(q) && !guesses.some(g => g.name === s.name))
    .slice(0, 8);

  if (matches.length === 0) { suggestions.classList.remove('active'); return; }

  suggestions.innerHTML = '';
  matches.forEach(s => {
    const item = document.createElement('div');
    item.className = 'suggestion-item';
    item.appendChild(createAvatar(s.name, true));
    const nameSpan = document.createElement('span');
    nameSpan.className = 's-name';
    nameSpan.textContent = s.name;
    item.appendChild(nameSpan);
    const meta = document.createElement('span');
    meta.className = 's-meta';
    meta.textContent = `${s.region} · ${s.decade}`;
    item.appendChild(meta);

    item.addEventListener('click', () => {
      searchInput.value = s.name;
      suggestions.classList.remove('active');
      submitGuess(s.name);
    });
    suggestions.appendChild(item);
  });
  suggestions.classList.add('active');
}

/* =========================================================
   事件绑定
   ========================================================= */
searchInput.addEventListener('input', e => showSuggestions(e.target.value));
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    suggestions.classList.remove('active');
    submitGuess(searchInput.value);
  }
  if (e.key === 'Escape') suggestions.classList.remove('active');
});
guessBtn.addEventListener('click', () => {
  suggestions.classList.remove('active');
  submitGuess(searchInput.value);
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search-section')) suggestions.classList.remove('active');
});

/* 放弃按钮 */
giveupBtn.addEventListener('click', () => {
  if (gameOver) return;
  if (!confirm('确定要放弃并直接查看答案吗？')) return;
  gameOver = true;
  searchInput.disabled = true;
  guessBtn.disabled = true;
  giveupBtn.disabled = true;
  revealAllClues();
  showResult('giveup', 0);
});

restartBtn.addEventListener('click', resetGame);

/* 启动 */
resetGame();
</script>
